name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  MPLBACKEND: Agg

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: Tests with the coverage gate
        run: uv run pytest --cov --cov-report=term

  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync
      - name: Every validation script reruns (HAI is skipped without its data)
        run: uv run python validation/run_all.py
      - name: Exact results reproduce byte for byte
        run: git diff --exit-code -- validation/results ':(exclude)validation/results/sequence_model.md'
      - name: The CNN's results reproduce within tolerance
        run: uv run python validation/check_tolerant.py validation/results/sequence_model.md
      - name: Every notebook executes
        run: uv run python notebooks/build_notebooks.py --check

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Dependency audit
        run: |
          # cpsrbd is the author's own CPS-02 package, installed from a git tag, not PyPI.
          # torch comes from the PyTorch CPU index as "<version>+cpu", a local version PyPI's
          # advisory database cannot look up, so it is audited by its public version instead.
          uv export --no-emit-project --all-groups --no-emit-package cpsrbd --no-emit-package torch --format requirements-txt -o requirements-audit.txt -q
          uvx pip-audit -r requirements-audit.txt --disable-pip --strict
          echo "torch==$(uv run python -c 'import torch; print(torch.__version__.split("+")[0])')" > torch-audit.txt
          uvx pip-audit -r torch-audit.txt --disable-pip --no-deps --strict
